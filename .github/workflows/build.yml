name: Build TGTranslate IPA

# 放到 fork 仓库的 .github/workflows/build.yml
# 与官方 .github/workflows/build.yml 的差异：
#   1. runs-on 从钉死的 macos-13 改成可用的新版 runner（见 RUNNER_LABEL）
#   2. 构建加 --overrideXcodeVersion，避免 versions.json 要求 Xcode 27.1 而 runner 没有时直接失败
#   3. 用 softprops/action-gh-release 取代已废弃的 actions/create-release@v1 + upload-release-asset@v1
#   4. IPA 走 Release asset（不占 Free 计划 500MB artifact 额度）
#   5. 打印环境自检信息，便于对照 CI-TROUBLESHOOTING.md 定位失败点

on:
  push:
    branches: [ master ]
  # macOS 额度耗尽期间靠定时任务自动重抢：额度一恢复，任意一次就会跑完并自动发 Release
  workflow_dispatch:
    inputs:
      override_xcode:
        description: "忽略 versions.json 的 Xcode 版本要求"
        type: boolean
        default: true
      runner:
        description: "runner 标签（macos-15 / macos-26；空=macos-15）"
        type: string
        default: "macos-15"

permissions:
  contents: write   # 创建 Release / 上传资产必需

env:
  # 注意：runs-on 不接受 env 上下文（GitHub 会报 Unrecognized named-value: 'env'），
  # 所以 runner 标签必须写字面量，见下面 jobs.build.runs-on。
  # 可选值：macos-15 / macos-26
  # 构建目录（官方要求路径稳定，源码路径会进二进制）
  SOURCE_DIR: /Users/Shared/telegram-ios

jobs:
  build:
    # inputs 上下文可用于 runs-on（env 不行）；push 触发时 inputs 为空 → 回退 macos-15
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 150

    steps:
      - name: Checkout（子模块由下一步手动拉，需要完整历史给 build number）
        uses: actions/checkout@v4
        with:
          # 关键：不能让 actions/checkout 拉子模块。.gitmodules 里有相对 URL（../tgcalls.git），
          # GitHub 会把它解析成 <fork 属主>/tgcalls → 404（实测报错：zzz1800/tgcalls not found）。
          submodules: false
          fetch-depth: 0

      - name: 纠正相对子模块 URL 并拉取子模块
        run: |
          set -x
          # 把所有 ../xxx 形式的 url 改成上游绝对地址（目前只有 tgcalls 一处，写成通用规则防以后新增）
          python3 - <<'EOF'
          import subprocess
          out = subprocess.check_output(
              ["git", "config", "--file", ".gitmodules", "--get-regexp", "url"], text=True)
          for line in out.strip().splitlines():
              key, url = line.split(None, 1)
              if url.strip().startswith("../"):
                  name = url.strip().rstrip("/").split("/")[-1]
                  new = "https://github.com/TelegramMessenger/" + name
                  subprocess.check_call(["git", "config", "--file", ".gitmodules", key, new])
                  print("rewrite", key, url.strip(), "->", new)
          EOF
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8

      - name: 环境自检（失败时先看这一步的日志）
        run: |
          set -x
          sw_vers
          xcodebuild -version || true
          ls /Applications | grep -i xcode || true
          python3 --version
          git --version
          df -h /
          echo "--- versions.json ---"
          cat versions.json

      - name: 选择 Xcode
        run: |
          WANTED=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "versions.json 要求 Xcode: $WANTED"
          if [ -d "/Applications/Xcode_$WANTED.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$WANTED.app/Contents/Developer"
            echo "使用 Xcode_$WANTED"
          else
            INSTALLED=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "未安装 Xcode_$WANTED，回退到 $INSTALLED（配合 --overrideXcodeVersion）"
            sudo xcode-select -s "$INSTALLED/Contents/Developer"
          fi
          xcodebuild -version

      - name: 规范化源码目录
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo rm -rf "$SOURCE_DIR"
          sudo cp -R "$GITHUB_WORKSPACE" "$SOURCE_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$SOURCE_DIR"

      - name: 计算 build number
        id: buildnum
        run: |
          cd "$SOURCE_DIR"
          OFFSET="$(cat build_number_offset)"
          COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COUNT + OFFSET))"
          APP_VERSION="$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER app=$APP_VERSION"

      - name: 导入伪造签名证书（TrollStore 装未签名包，不需要真实证书）
        run: |
          cd "$SOURCE_DIR"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: 续签假描述文件（仓库自带的那批已于 2026-10-30 过期）
        run: |
          cd "$SOURCE_DIR"
          python3 scripts/renew_profiles.py --days 365

      - name: 恢复 Bazel 缓存（二次构建提速）
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: /Users/Shared/bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-
            bazel-${{ runner.os }}-

      - name: 构建（release_arm64）
        run: |
          set -x
          cd "$SOURCE_DIR"
          OVERRIDE=""
          if [ "${{ inputs.override_xcode }}" != "false" ]; then OVERRIDE="--overrideXcodeVersion"; fi
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="/private/var/tmp/_bazel_containerhost" \
            $OVERRIDE \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --cacheDir="/Users/Shared/bazel-cache" \
            --buildNumber="${{ steps.buildnum.outputs.BUILD_NUMBER }}"

      - name: 收集产物
        run: |
          set -x
          cd "$SOURCE_DIR"
          mkdir -p build/artifacts
          BAZEL_ROOT="/private/var/tmp/_bazel_containerhost"

          # 说明：Bazel 把产物放在 --bazelUserRoot 的 output base 里，
          # 源码目录下通常没有 bazel-out/bazel-bin 链接（本机实测 find bazel-out 为空）。
          FOUND=""
          if [ -f bazel-bin/Telegram/Telegram.ipa ]; then
            FOUND="bazel-bin/Telegram/Telegram.ipa"
          fi
          if [ -z "$FOUND" ]; then
            FOUND=$(find -L "$BAZEL_ROOT" -name 'Telegram.ipa' -type f 2>/dev/null | head -1)
          fi
          if [ -z "$FOUND" ]; then
            FOUND=$(find -L . -name 'Telegram.ipa' -type f 2>/dev/null | head -1)
          fi

          # 兜底：没有 .ipa 就自己把 .app 打成 ipa
          if [ -z "$FOUND" ]; then
            echo "::warning::没找到 .ipa，尝试用 Telegram.app 自打包"
            APP=$(find -L "$BAZEL_ROOT" -name 'Telegram.app' -type d 2>/dev/null | head -1)
            if [ -n "$APP" ]; then
              rm -rf /tmp/ipastage && mkdir -p /tmp/ipastage/Payload
              cp -R "$APP" /tmp/ipastage/Payload/
              (cd /tmp/ipastage && zip -qry "$SOURCE_DIR/build/artifacts/Telegram.ipa" Payload)
              FOUND="$SOURCE_DIR/build/artifacts/Telegram.ipa"
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "::error::既没有 Telegram.ipa 也没有 Telegram.app"
            ls -la "$BAZEL_ROOT" 2>/dev/null | head -20
            find -L "$BAZEL_ROOT" -maxdepth 4 -type d -name 'bazel-out' 2>/dev/null | head -5
            exit 1
          fi

          echo "found: $FOUND"
          ls -lh "$FOUND"
          if [ "$FOUND" != "$SOURCE_DIR/build/artifacts/Telegram.ipa" ]; then
            cp "$FOUND" build/artifacts/Telegram.ipa
          fi
          ls -lh build/artifacts/Telegram.ipa
          unzip -l build/artifacts/Telegram.ipa | head -20

      - name: 上传 IPA 为构建产物（兜底，便于 API 下载）
        uses: actions/upload-artifact@v4
        with:
          name: Telegram.ipa
          path: ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.ipa
          retention-days: 7
          if-no-files-found: error

      - name: 发布为 Release asset（不占 artifact 额度）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.buildnum.outputs.BUILD_NUMBER }}
          name: TGTranslate ${{ steps.buildnum.outputs.APP_VERSION }} (${{ steps.buildnum.outputs.BUILD_NUMBER }})
          body: |
            未签名 IPA（TrollStore 直接安装）。
            应用版本：${{ steps.buildnum.outputs.APP_VERSION }}
            构建号：${{ steps.buildnum.outputs.BUILD_NUMBER }}
            翻译通道：Google (gtx) / 百度（可选，需自备 APPID+密钥）
          files: ${{ env.SOURCE_DIR }}/build/artifacts/Telegram.ipa
          fail_on_unmatched_files: true

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.SOURCE_DIR }}/build/**/*.log
          retention-days: 3
          if-no-files-found: ignore
